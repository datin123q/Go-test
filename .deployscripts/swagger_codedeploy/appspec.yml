version: 0.0
os: linux

files:
  - source: /
    destination: /tmp/build
file_exists_behavior: OVERWRITE
permissions:
  - object: /tmp/build
    owner: ubuntu
    group: ubuntu
    mode: 755
hooks:
  BeforeInstall:
    - location: before_codedeploy.sh
      timeout: 300
  AfterInstall:
    - location: after_codedeploy.sh
      timeout: 300