policy_data:
  - policy_view_type: "POLICY_VIEW_FOOTER"
    policy_type: "POLICY_CAUTION"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">EnergySharesサービス利用規約</span></strong></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">この利用規約（以下「本規約」）は、エナジーシェアーズ株式会社（以下、「当社」）が</span><span style=\"font-weight: 400;\">EnergySharesサービス</span><span style=\"font-weight: 400;\">（「</span><span style=\"font-weight: 400;\">サービス</span><span style=\"font-weight: 400;\">」とは、当社が運営するウェブサイトまたはアプリケーション等、サービス全般を含む、以下「本サービス」といいます。）で提供するサービスの利用条件を定めるものです。<br /></span><span style=\"font-weight: 400;\">本サービスの利用に際し、本サービスの利用者（以下「お客様」といいます。）は、本規約の全文をお読みいただいた上で、本規約に同意いただく必要がございます。またお客様が本サービスをご利用いただいた場合は本規約の全てに同意したものとみなします。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;1. 本規約の適用範囲</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 本規約は当社が提供する本サービスの利用に対して適用されます。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 本規約とは別に、当社が別途定める諸規定等が存在する場合は、その規定に従うものとします。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;2. 禁止事項</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) お客様は本サービスのご利用に際し、以下の行為をしてはならないものとします。</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">1. 本サービスを不正な目的のために利用する行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">2. 法令またはそれに類するものに違反する行為または助⾧する行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">3. 犯罪行為もしくは犯罪に関連するすべての行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">4. 公序良俗に違反する行為またはその虞がある行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">5. 本サービスに含まれる情報についてのスクレイピング行為及びクローリング行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">6. 他のお客様の個人情報や履歴情報等を無断で収集、蓄積したりする行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">7. 当社を含む他人の名誉、信用、プライバシー権、パブリシティ権、著作権またはその他の権利を侵害する行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">8. 本サービスの利用契約上の地位または本規約に基づく権利もしくは義務の全部もしくは一部を第三者への譲渡（包括承継を含む）または担保の設定、その他一切の処分をする行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">9. 本サイトや本サイト記載の情報に関しては全部、一部にかかわらず当社に無断で利用すること（利用には使用、複製、複写、アップロード、ダウンロード、販売、送信、販売、転売、再販売を含みます）</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">10. 反社会的勢力等への利益供与</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">11. 第三者に自己のアカウントを使用させて本サービスを利用させる行為または他のお客様の本アカウントを使用して本サービスを利用する行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">12. RPAやボットなどの自動化された手段を用いて本サービスを利用する、または意思能力・行為能力が認められないと当社が判断するお客様による本サービスの利用</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">13. 手段の如何を問わず、他のお客様にユーザーIDやパスワードを開示し、または提供する行為及び他のお客様からユーザーIDやパスワードの提供を受ける行為、並びに他のサービスと同じパスワードを使いまわす行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">14. 一人の利用者が複数のアカウントを持つ行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">15. 当社のサーバー、ネットワーク及びシステム等に不正にアクセスする行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">16. 当社のサーバーに負担をかける行為及び他のお客様のアクセスや操作を妨害する等の本サービスの運営を妨げる行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">17. 第三者に不利益を与える行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">18. 本サービスに関連して当社から得た機密情報を第三者に開示する行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">19. 当社または本サービスの信用を毀損する、または本規約その他本サービスの内容または趣旨に違反する一切の行為</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">20. 以下の方が本サービスを利用する行為</span></p>\n<div style=\"padding-left: 120px;\"><span style=\"font-weight: 400;\">a 日本の非居住者の方</span></div>\n<div style=\"padding-left: 120px;\"><span style=\"font-weight: 400;\">b 20歳未満75歳以上の方</span></div>\n<div style=\"padding-left: 120px;\"><span style=\"font-weight: 400;\">c 年収300万円未満の方</span></div>\n<div style=\"padding-left: 120px;\"><span style=\"font-weight: 400;\">d 金融資産300万円未満の方</span></div>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;3. 免責事項</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) お客様が本規約に違反した場合、または不適切な行為を行ったと当社が判断した場合には、当社はお客様に対して本サ&mdash;ビスの利用停止、会員登録の抹消等の措置をお客様の許諾をとることなく実行する場合があります。また当該措置を行った理由について当社はお客様に対し説明責任を負わないものとします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 当社は本サービスの全部もしくは一部を事前の通告なく停止することができ、事前の通告をして本サービスを終了することができます。その際に生じた損害や不利益に関して当社は一切の責任を負いません。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(3)当社は前項の措置に起因してお客様または第三者に損害が生じても一切の責任を負わないものとします。</span></p>\n<p style=\"text-align: left; padding-left: 40px;\"><span style=\"font-weight: 400;\">(4) 当社は、本サービスに起因してお客様に生じたあらゆる損害について、一切の責任を負いません。ただし、本サービスに関する当社とお客様との間の契約（本規約を含みます。）が消費者契約法（平成十二年法律第六十一号をいい、その後の改正を含みます。）に定める消費者契約となる場合、この免責事項は適用されません。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(5) 当社は、第三者によってお客様が被った損害または損失について、一切の責任を負いません。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(6) 当社は、本サービス、情報、コンテンツなどに関して万全の注意を期しておりますが、その内容の完全性を保証するものではありません。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(7) お客様が本サービスを通じて行う匿名組合契約の締結及び出資その他の行為は、お客様自らの責任において行っていただき、当社は投資判断に関して何ら責任を負いません。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;4. 会員登録に関する事項</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 本規約と会員登録の際に同意いただく規約や同意書に同意されたお客様のみが本サービスの会員登録申請をしていただけます。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 当社は当社手続に従い登録申請を行った登録希望者（以下「登録申請者」）の登録可否を当社の定める基準に従い判断致します。当社が登録を承認する場合はその旨をメールにて登録申請者に通知いたします。審査基準や審査結果に関し、当社は一切回答する義務を負いません。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(3) 当社が、登録申請者に以下の各号のいずれかの事由があると判断した場合、登録申請を承認しないことがあります。当社は、いかなる理由があっても、審査基準については一切の開示義務を負わないものとします。</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">1&nbsp; 利用登録の申請に際して虚偽の事項を届け出た場合</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">2&nbsp; 本規約に違反したことがある者からの申請である場合</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">3&nbsp; 未成年者、成年被後見人、被保佐人または被補助人のいずれかに該当する場合</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">4&nbsp; 反社会的勢力等であること、または資金提供その他を通じて反社会的勢力等の維持、運営もしくは経営に協力あるいは関与する等反社会的勢力との何らかの交流もしくは関与を行っていると当社が判断した場合</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">5&nbsp; 外国PEPsに該当する場合（外国PEPsとは、外国の元首や高位の政治家など、過去を含め「外国において重要な公的地位を有する者」または「その方の家族」を指します。）。</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">6&nbsp; 登録希望者が過去当社との契約に違反した者またはその関係者であると当社が判断した場合</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">7&nbsp; その他、当社が本会員への登録を適当でないと判断した場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(4) お客様は、本サービスの利用に際してお客様に関する情報（以下「お客様情報」といいます。）を登録する場合、全ての点について、真実、正確かつ完全な情報を提供しなければならず、お客様情報に変更があった場合は、直ちに変更の手続きをしなければならないものとします。お客様が真実、正確または完全でない情報を提供した場合、または最新の情報となるようへの修正を行うことを怠った場合、当社はこれによって発生した損害について一切の責任を負いません。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(5) お客様は、自己の責任において本サービスに関するパスワードを適切に管理及び保管するものとします。また、第三者への利用、貸与、譲渡、名義変更及び売買をしてはならないものとします。またセキュリティの観点から生年月日や誕生日など推測されやすいものは避けていただき、定期的に変更していただきますようお願いいたします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(6) 当社は、登録されたお客様情報によって本サービスの利用があった場合、お客様情報の登録を行ったお客様が利用したものと扱うことができ、当該利用によって生じた結果並びにそれに伴う一切の責任については、お客様情報の登録を行ったお客様に帰属するものとし、当社は一切の責任を負いません。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(7) お客様情報を変更する場合に、一部の情報に関しましては公的書類を送付いただくことが必要となる場合がございます。あらかじめご了承ください。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(8) お客様が退会を希望する場合には、当社が定める所定の手続により退会する旨を当社に対し届け出るものとします。当社は、退会の届出があった場合、当社所定の手続及び条件による届出を受理するものとします。なお、お客様が上記方法以外の手段によって退会を届け出た場合、当社はこれを退会の届出として取り扱いません。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;5. 利用制限・登録抹消に関して</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 当社は、お客様が以下の各号のいずれかの事由に該当する場合は、事前の通知なく、お客様に対して本サービスの全部もしくは一部の利用を制限し、またはお客様に関して当社が保有する情報を抹消することができるものとします。</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">1&nbsp; 本規約のいずれかの条項に違反した場合</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">2&nbsp; 登録事項に虚偽の事実があることが判明した場合</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">3&nbsp; 破産、民事再生、会社整理、会社更生の手続開始決定、特別清算の申立、または私的整理等のその他倒産類型に該当する手続きが判明した場合</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">4&nbsp; 最終アクセスから１年以上本サービスの利用がない場合</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">5&nbsp; 当社からの問い合わせその他の回答を求める連絡に対して、１ヶ月以上に亘り当社が相当と認める応答がない場合</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">6&nbsp; その他、当社がお客様による本サービスの利用が適当でないと判断した場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 当社は、本条に基づき当社が行った行為によりお客様に生じた損害について、一切の責任を負いません。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;6. リスクに関する事項</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 本匿名組合契約により投資家が取得する出資持分は、元本が保証されている商品ではなく、元本割れのリスクがあります。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 上記出資持分は、中途解約はできず、また売却も困難であることなど、流動性が低い商品です。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(3) 本匿名組合契約は、営業者である当社が借り手を選定する権利を有しており、投資家が選定することはできません。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(4) 借り手の破綻により、本匿名組合契約に基づく収益の分配や元本の償還がなされず、出資金額が毀損する恐れがあります。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(5) 借り手の事情により、運用開始が遅延し、又は期限前弁済により早期償還がなされ、実質的な利回りが予定利回りを下回る場合があります。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(6) 営業者である当社が支払不能に陥り、破産手続、民事再生手続、会社更生手続の開始決定がなされるなどした場合には、本匿名組合契約に基づく収益の分配や元本の償還がなされず、出資金額が毀損する恐れがあります。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(7) 法令又は税制等の変更により、営業者である当社の業務等が制限され、又は投資家に分配される収益や償還される元金の額に悪影響を及ぼす恐れがあります。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(8) 取引開始にあたっては契約締結前書面を熟読いただき、投資リスクを十分にご理解の上、投資のご判断をしてください。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;7. 反社会的勢力の排除に関して</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社は、暴力団、暴力団員、暴力団員でなくなった時から5年を経過しない者、暴力団準構成員、暴力団関係企業、総会屋、社会運動等標ぼうゴロまたは特殊知能暴力集団、その他これらに準ずる者と当社が判断した者よる本サービスの利用を禁止します。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;8. 個人情報の取り扱い</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 当社によるお客様の個人情報の取り扱いについては、以下に定める個人情報保護方針の定めによるものとします。</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">1&nbsp; 情報資産の対象は当社が本サービスの運営や業務上保有するすべての情報を対象とします。</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">2&nbsp; 当社は個人情報に関する社内規定を整備しており当該規程を遵守し、周知徹底につとめます。</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">3&nbsp; 当社は情報資産に関する物理的・社内外の人的側面を考慮し、セキュリティ対策を進めてまいります。</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">4&nbsp; 当社は情報資産保護のため教育や訓練を継続的に実施してまいります。</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">5&nbsp; 当社は業務の提携にあたり厳格な審査の上、契約を決定し、また当社と同等以上のセキュリティレベルを求めます。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 当サービスにおいてサービス向上のためにCookieを取得する場合があります。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;9. 包括継承</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 相続や合併によりお客様に包括承継が発生した場合は、当該権利を継承される方からの手続きを行うものとします。また、手続きの際には当社が求める書類を提出するものとし、当社が包括承継を確認するまでは当社に対しては対抗できないものとします。加えて、当社は承継人が複数存在する場合も代表者１名のみを承継人とします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 当社は包括承継の事実を確認した際には、被承継人のアカウントに関しては利用制限や利用停止ができるものとします。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;10. 書面等の発行に関して</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">本サービスの利用などに際して、別途定めのある場合を除き当社からは領収書または海外法令に基づく如何なる書面等の発行を行わないことにお客様は同意をしているものとします。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;11. 権利の帰属に関して</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 本サービス及び関連する一切の情報についての著作権及びその他知的財産権（第三者に帰属するものを除きます。）は、すべて当社または当社にその利用を諾した権利者に帰属します。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) お客様は、サービスコンテンツを当社に無断で複製、譲渡、貸与、翻訳、改変、転載、公衆送信（送信可能化を含みます。）、伝送、配布、出版、営業使用等をしてはならないものとします。</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;12. 利用規約に関して</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 当社は、本規約についてお客様の承諾を得ることなく変更することがございます。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 変更後の本規約は、お客様が当ウェブサイトを利用した時点で、本規約の変更内容に同意したものとみなします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(3) 本規約のいずれかの条項またはその一部が、無効または執行不能と判断された場合であっても、本規約の残りの規定及びその一部が無効または執行不能と判断された規定の残りの部分については継続して完全に効力を有するものとします。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;13. 準拠法</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">本規約は日本法を準拠法とし、日本法に従い解釈されるものとします。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;14. 裁判管轄に関して</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">本サイトまたは本利用規約に関連して生じた一切の紛争に関しては、東京地方裁判所を第一審の専属的合意管轄裁判所とします。</span></p>\n<p>&nbsp;</p>\n<p style=\"text-align: right;\"><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;制定日 2020年11月16日</span></p>"
  - policy_view_type: "POLICY_VIEW_JOIN"
    policy_type: "POLICY_CAUTION"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">EnergySharesサービス利用規約</span></strong></p>\n<p>&nbsp;</p>\n<p style=\"text-align: justify;\"><span style=\"font-weight: 400;\">この利用規約（以下「本規約」）は、エナジーシェアーズ株式会社（以下、「当社」）が</span><span style=\"font-weight: 400;\">EnergySharesサービス</span><span style=\"font-weight: 400;\">（「</span><span style=\"font-weight: 400;\">サービス</span><span style=\"font-weight: 400;\">」とは、当社が運営するウェブサイトまたはアプリケーション等、サービス全般を含む、以下「本サービス」といいます。）で提供するサービスの利用条件を定めるものです。<br /></span><span style=\"font-weight: 400;\">本サービスの利用に際し、本サービスの利用者（以下「お客様」といいます。）は、本規約の全文をお読みいただいた上で、本規約に同意いただく必要がございます。またお客様が本サービスをご利用いただいた場合は本規約の全てに同意したものとみなします。</span></p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">1. 本規約の適用範囲</span></p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">(1) 本規約は当社が提供する本サービスの利用に対して適用されます。</span></p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">(2) 本規約とは別に、当社が別途定める諸規定等が存在する場合は、その規定に従うものとします。</span></p>\n<p><span style=\"font-weight: 400;\">2. 禁止事項</span></p>\n<p><span style=\"font-weight: 400;\">(1) お客様は本サービスのご利用に際し、以下の行為をしてはならないものとします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">1. 本サービスを不正な目的のために利用する行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">2. 法令またはそれに類するものに違反する行為または助⾧する行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">3. 犯罪行為もしくは犯罪に関連するすべての行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">4. 公序良俗に違反する行為またはその虞がある行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">5. 本サービスに含まれる情報についてのスクレイピング行為及びクローリング行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">6. 他のお客様の個人情報や履歴情報等を無断で収集、蓄積したりする行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">7. 当社を含む他人の名誉、信用、プライバシー権、パブリシティ権、著作権またはその他の権利を侵害する行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">8. 本サービスの利用契約上の地位または本規約に基づく権利もしくは義務の全部もしくは一部を第三者への譲渡（包括承継を含む）または担保の設定、その他一切の処分をする行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">9. 本サイトや本サイト記載の情報に関しては全部、一部にかかわらず当社に無断で利用すること（利用には使用、複製、複写、アップロード、ダウンロード、販売、送信、販売、転売、再販売を含みます）</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">10. 反社会的勢力等への利益供与</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">11. 第三者に自己のアカウントを使用させて本サービスを利用させる行為または他のお客様の本アカウントを使用して本サービスを利用する行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">12. RPAやボットなどの自動化された手段を用いて本サービスを利用する、または意思能力・行為能力が認められないと当社が判断するお客様による本サービスの利用</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">13. 手段の如何を問わず、他のお客様にユーザーIDやパスワードを開示し、または提供する行為及び他のお客様からユーザーIDやパスワードの提供を受ける行為、並びに他のサービスと同じパスワードを使いまわす行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">14. 一人の利用者が複数のアカウントを持つ行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">15. 当社のサーバー、ネットワーク及びシステム等に不正にアクセスする行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">16. 当社のサーバーに負担をかける行為及び他のお客様のアクセスや操作を妨害する等の本サービスの運営を妨げる行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">17. 第三者に不利益を与える行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">18. 本サービスに関連して当社から得た機密情報を第三者に開示する行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">19. 当社または本サービスの信用を毀損する、または本規約その他本サービスの内容または趣旨に違反する一切の行為</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">20. 以下の方が本サービスを利用する行為</span></p>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">a 日本の非居住者の方</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">b 20歳未満75歳以上の方</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">c 年収300万円未満の方</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">d 金融資産300万円未満の方</span></div>\n<p><span style=\"font-weight: 400;\">3. 免責事項</span></p>\n<p><span style=\"font-weight: 400;\">(1) お客様が本規約に違反した場合、または不適切な行為を行ったと当社が判断した場合には、当社はお客様に対して本サ&mdash;ビスの利用停止、会員登録の抹消等の措置をお客様の許諾をとることなく実行する場合があります。また当該措置を行った理由について当社はお客様に対し説明責任を負わないものとします。</span></p>\n<p><span style=\"font-weight: 400;\">(2) 当社は本サービスの全部もしくは一部を事前の通告なく停止することができ、事前の通告をして本サービスを終了することができます。その際に生じた損害や不利益に関して当社は一切の責任を負いません。</span></p>\n<p><span style=\"font-weight: 400;\">(3)当社は前項の措置に起因してお客様または第三者に損害が生じても一切の責任を負わないものとします。</span></p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">(4) 当社は、本サービスに起因してお客様に生じたあらゆる損害について、一切の責任を負いません。ただし、本サービスに関する当社とお客様との間の契約（本規約を含みます。）が消費者契約法（平成十二年法律第六十一号をいい、その後の改正を含みます。）に定める消費者契約となる場合、この免責事項は適用されません。</span></p>\n<p><span style=\"font-weight: 400;\">(5) 当社は、第三者によってお客様が被った損害または損失について、一切の責任を負いません。</span></p>\n<p><span style=\"font-weight: 400;\">(6) 当社は、本サービス、情報、コンテンツなどに関して万全の注意を期しておりますが、その内容の完全性を保証するものではありません。</span></p>\n<p><span style=\"font-weight: 400;\">(7) お客様が本サービスを通じて行う匿名組合契約の締結及び出資その他の行為は、お客様自らの責任において行っていただき、当社は投資判断に関して何ら責任を負いません。</span></p>\n<p><span style=\"font-weight: 400;\">4. 会員登録に関する事項</span></p>\n<p><span style=\"font-weight: 400;\">(1) 本規約と会員登録の際に同意いただく規約や同意書に同意されたお客様のみが本サービスの会員登録申請をしていただけます。</span></p>\n<p><span style=\"font-weight: 400;\">(2) 当社は当社手続に従い登録申請を行った登録希望者（以下「登録申請者」）の登録可否を当社の定める基準に従い判断致します。当社が登録を承認する場合はその旨をメールにて登録申請者に通知いたします。審査基準や審査結果に関し、当社は一切回答する義務を負いません。</span></p>\n<p><span style=\"font-weight: 400;\">(3) 当社が、登録申請者に以下の各号のいずれかの事由があると判断した場合、登録申請を承認しないことがあります。当社は、いかなる理由があっても、審査基準については一切の開示義務を負わないものとします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">1&nbsp; 利用登録の申請に際して虚偽の事項を届け出た場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">2&nbsp; 本規約に違反したことがある者からの申請である場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">3&nbsp; 未成年者、成年被後見人、被保佐人または被補助人のいずれかに該当する場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">4&nbsp; 反社会的勢力等であること、または資金提供その他を通じて反社会的勢力等の維持、運営もしくは経営に協力あるいは関与する等反社会的勢力との何らかの交流もしくは関与を行っていると当社が判断した場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">5&nbsp; 外国PEPsに該当する場合（外国PEPsとは、外国の元首や高位の政治家など、過去を含め「外国において重要な公的地位を有する者」または「その方の家族」を指します。）。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">6&nbsp; 登録希望者が過去当社との契約に違反した者またはその関係者であると当社が判断した場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">7&nbsp; その他、当社が本会員への登録を適当でないと判断した場合</span></p>\n<p><span style=\"font-weight: 400;\">(4) お客様は、本サービスの利用に際してお客様に関する情報（以下「お客様情報」といいます。）を登録する場合、全ての点について、真実、正確かつ完全な情報を提供しなければならず、お客様情報に変更があった場合は、直ちに変更の手続きをしなければならないものとします。お客様が真実、正確または完全でない情報を提供した場合、または最新の情報となるようへの修正を行うことを怠った場合、当社はこれによって発生した損害について一切の責任を負いません。</span></p>\n<p><span style=\"font-weight: 400;\">(5) お客様は、自己の責任において本サービスに関するパスワードを適切に管理及び保管するものとします。また、第三者への利用、貸与、譲渡、名義変更及び売買をしてはならないものとします。またセキュリティの観点から生年月日や誕生日など推測されやすいものは避けていただき、定期的に変更していただきますようお願いいたします。</span></p>\n<p><span style=\"font-weight: 400;\">(6) 当社は、登録されたお客様情報によって本サービスの利用があった場合、お客様情報の登録を行ったお客様が利用したものと扱うことができ、当該利用によって生じた結果並びにそれに伴う一切の責任については、お客様情報の登録を行ったお客様に帰属するものとし、当社は一切の責任を負いません。</span></p>\n<p><span style=\"font-weight: 400;\">(7) お客様情報を変更する場合に、一部の情報に関しましては公的書類を送付いただくことが必要となる場合がございます。あらかじめご了承ください。</span></p>\n<p><span style=\"font-weight: 400;\">(8) お客様が退会を希望する場合には、当社が定める所定の手続により退会する旨を当社に対し届け出るものとします。当社は、退会の届出があった場合、当社所定の手続及び条件による届出を受理するものとします。なお、お客様が上記方法以外の手段によって退会を届け出た場合、当社はこれを退会の届出として取り扱いません。</span></p>\n<p><span style=\"font-weight: 400;\">5. 利用制限・登録抹消に関して</span></p>\n<p><span style=\"font-weight: 400;\">(1) 当社は、お客様が以下の各号のいずれかの事由に該当する場合は、事前の通知なく、お客様に対して本サービスの全部もしくは一部の利用を制限し、またはお客様に関して当社が保有する情報を抹消することができるものとします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">1&nbsp; 本規約のいずれかの条項に違反した場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">2&nbsp; 登録事項に虚偽の事実があることが判明した場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">3&nbsp; 破産、民事再生、会社整理、会社更生の手続開始決定、特別清算の申立、または私的整理等のその他倒産類型に該当する手続きが判明した場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">4&nbsp; 最終アクセスから１年以上本サービスの利用がない場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">5&nbsp; 当社からの問い合わせその他の回答を求める連絡に対して、１ヶ月以上に亘り当社が相当と認める応答がない場合</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">6&nbsp; その他、当社がお客様による本サービスの利用が適当でないと判断した場合</span></p>\n<p><span style=\"font-weight: 400;\">(2) 当社は、本条に基づき当社が行った行為によりお客様に生じた損害について、一切の責任を負いません。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp;6. リスクに関する事項</span></p>\n<p><span style=\"font-weight: 400;\">(1) 本匿名組合契約により投資家が取得する出資持分は、元本が保証されている商品ではなく、元本割れのリスクがあります。</span></p>\n<p><span style=\"font-weight: 400;\">(2) 上記出資持分は、中途解約はできず、また売却も困難であることなど、流動性が低い商品です。</span></p>\n<p><span style=\"font-weight: 400;\">(3) 本匿名組合契約は、営業者である当社が借り手を選定する権利を有しており、投資家が選定することはできません。</span></p>\n<p><span style=\"font-weight: 400;\">(4) 借り手の破綻により、本匿名組合契約に基づく収益の分配や元本の償還がなされず、出資金額が毀損する恐れがあります。</span></p>\n<p><span style=\"font-weight: 400;\">(5) 借り手の事情により、運用開始が遅延し、又は期限前弁済により早期償還がなされ、実質的な利回りが予定利回りを下回る場合があります。</span></p>\n<p><span style=\"font-weight: 400;\">(6) 営業者である当社が支払不能に陥り、破産手続、民事再生手続、会社更生手続の開始決定がなされるなどした場合には、本匿名組合契約に基づく収益の分配や元本の償還がなされず、出資金額が毀損する恐れがあります。</span></p>\n<p><span style=\"font-weight: 400;\">(7) 法令又は税制等の変更により、営業者である当社の業務等が制限され、又は投資家に分配される収益や償還される元金の額に悪影響を及ぼす恐れがあります。</span></p>\n<p><span style=\"font-weight: 400;\">(8) 取引開始にあたっては契約締結前書面を熟読いただき、投資リスクを十分にご理解の上、投資のご判断をしてください。</span></p>\n<p><span style=\"font-weight: 400;\">7. 反社会的勢力の排除に関して</span></p>\n<p><span style=\"font-weight: 400;\">当社は、暴力団、暴力団員、暴力団員でなくなった時から5年を経過しない者、暴力団準構成員、暴力団関係企業、総会屋、社会運動等標ぼうゴロまたは特殊知能暴力集団、その他これらに準ずる者と当社が判断した者よる本サービスの利用を禁止します。</span></p>\n<p><span style=\"font-weight: 400;\">8. 個人情報の取り扱い</span></p>\n<p><span style=\"font-weight: 400;\">(1) 当社によるお客様の個人情報の取り扱いについては、以下に定める個人情報保護方針の定めによるものとします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">1&nbsp; 情報資産の対象は当社が本サービスの運営や業務上保有するすべての情報を対象とします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">2&nbsp; 当社は個人情報に関する社内規定を整備しており当該規程を遵守し、周知徹底につとめます。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">3&nbsp; 当社は情報資産に関する物理的・社内外の人的側面を考慮し、セキュリティ対策を進めてまいります。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">4&nbsp; 当社は情報資産保護のため教育や訓練を継続的に実施してまいります。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">5&nbsp; 当社は業務の提携にあたり厳格な審査の上、契約を決定し、また当社と同等以上のセキュリティレベルを求めます。</span></p>\n<p><span style=\"font-weight: 400;\">(2) 当サービスにおいてサービス向上のためにCookieを取得する場合があります。</span></p>\n<p><span style=\"font-weight: 400;\">9. 包括継承</span></p>\n<p><span style=\"font-weight: 400;\">(1) 相続や合併によりお客様に包括承継が発生した場合は、当該権利を継承される方からの手続きを行うものとします。また、手続きの際には当社が求める書類を提出するものとし、当社が包括承継を確認するまでは当社に対しては対抗できないものとします。加えて、当社は承継人が複数存在する場合も代表者１名のみを承継人とします。</span></p>\n<p><span style=\"font-weight: 400;\">(2) 当社は包括承継の事実を確認した際には、被承継人のアカウントに関しては利用制限や利用停止ができるものとします。</span></p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">10. 書面等の発行に関して</span></p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">本サービスの利用などに際して、別途定めのある場合を除き当社からは領収書または海外法令に基づく如何なる書面等の発行を行わないことにお客様は同意をしているものとします。</span></p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">11. 権利の帰属に関して</span></p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">(1) 本サービス及び関連する一切の情報についての著作権及びその他知的財産権（第三者に帰属するものを除きます。）は、すべて当社または当社にその利用を諾した権利者に帰属します。</span></p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">(2) お客様は、サービスコンテンツを当社に無断で複製、譲渡、貸与、翻訳、改変、転載、公衆送信（送信可能化を含みます。）、伝送、配布、出版、営業使用等をしてはならないものとします。</span></p>\n<p><span style=\"font-weight: 400;\">12. 利用規約に関して</span></p>\n<p><span style=\"font-weight: 400;\">(1) 当社は、本規約についてお客様の承諾を得ることなく変更することがございます。</span></p>\n<p><span style=\"font-weight: 400;\">(2) 変更後の本規約は、お客様が当ウェブサイトを利用した時点で、本規約の変更内容に同意したものとみなします。</span></p>\n<p><span style=\"font-weight: 400;\">(3) 本規約のいずれかの条項またはその一部が、無効または執行不能と判断された場合であっても、本規約の残りの規定及びその一部が無効または執行不能と判断された規定の残りの部分については継続して完全に効力を有するものとします。</span></p>\n<p><span style=\"font-weight: 400;\">13. 準拠法</span></p>\n<p><span style=\"font-weight: 400;\">本規約は日本法を準拠法とし、日本法に従い解釈されるものとします。</span></p>\n<p><span style=\"font-weight: 400;\">14. 裁判管轄に関して</span></p>\n<p><span style=\"font-weight: 400;\">本サイトまたは本利用規約に関連して生じた一切の紛争に関しては、東京地方裁判所を第一審の専属的合意管轄裁判所とします。</span></p>\n<p>&nbsp;</p>\n<p style=\"text-align: right;\"><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;制定日 2020年11月16日</span></p>"

  - policy_view_type: "POLICY_VIEW_FOOTER"
    policy_type: "POLICY_PROTECTION"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">個人情報保護方針</span></strong></p>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社(以下、「当社」)は、個人情報の保護、適正な管理が重要な社会責務であることを認識し、以下のとおり個人情報保護方針を定め、これを実行、維持してまいります。</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;1. 基本方針</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 当社は、事業目的遂行のため、利用目的を明確化した上で、適切な方法での取得、利用、提供などを行い、取得した個人情報は利用目的の範囲内の利用とし、目的外の利用を行わない様に措置を講じます。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 当社は、取扱う個人情報（特定個人情報を含む）の全てにおき個人情報の取扱いに関する法令、国が定める指針及びその他の規範を遵守いたします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(3) お預かりした個人情報の一部又は全部を委託する場合は、管理水準の基準を満たした企業及び個人を選定し、契約を行い、適切な措置と管理を講じます。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(4) 当社は、個人情報の漏洩、滅失,き損及び破壊などの危険な状況に対し十分に安全管理及び対策を行い、是正措置を講じます。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(5) 当社は個人情報をお預かりした本人からの個人情報の開示等のご要請にお答えし対応します。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(6) 苦情のご相談に対してはご相談窓口を設け、誠意を持ち迅速に対応をいたします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(7) 当社は、当社の個人情報マネジメントシステムを継続的に見直すとともに随時改善に取り組んでまいります。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;尚、当社の個人情報マネジメントシステムは日本工業規格JISQ１５００１-２０１７に準拠しております。</span></p>\n<div style=\"text-align: right;\"><span style=\"font-weight: 400;\">制定日2020年11月16日</span></div>\n<div style=\"text-align: right;\"><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社</span></div>\n<div style=\"text-align: right;\"><span style=\"font-weight: 400;\">代表取締役 菅原 寿</span><span style=\"font-weight: 400;\">&nbsp;</span></div>\n<p>&nbsp;</p>\n<div><span style=\"font-weight: 400;\">個人情報に関するお問合せ窓口</span></div>\n<div><span style=\"font-weight: 400;\">〒106-6137</span></div>\n<div><span style=\"font-weight: 400;\">東京都港区六本木6-10-1 六本木ヒルズ森タワー37階</span></div>\n<div><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社 個人情報ご相談窓口</span></div>\n<div><span style=\"font-weight: 400;\">TEL : 03-6384-5220&nbsp; FAX：03-6384-5223</span></div>\n<div><span style=\"font-weight: 400;\">E-MAIL：privacy@energyshares.jp</span></div>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">個人情報のお取扱いについて</span></strong></p>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社は個人情報保護の取り組みの一環として、個人情報のお取扱いについて、本人の知り得るべき状態における内容とともに、公表すべき事項を以下の通り掲載いたします。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">1. 個人情報取り扱い事業者の名称と個人情報保護管理者</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">&nbsp; &nbsp;エナジーシェアーズ株式会社</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">&nbsp; &nbsp;個人情報保護管理者 管理部長</span></div>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">2. 共同利用について</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社は、利用目的の達成、より良いサービスを提供するため、当社のグループ会社、業務提携企業及び協力企業との間で、取得した個人情報を共同で利用させていただく場合があります。</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">共同利用するの個人情報の項目</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">お名前、性別、生年月日、住所、電話番号、メールアドレス、勤務先、お客様の属性に関する情報、契約内容、お取引履歴等、その他下記「３項」に記載の利用目的を達成するために必要な項目</span></div>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">3. 直接ご本人様から取得させていただく個人情報の利用目的</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社が、直接ご本人様より取得させていただくもので、主に同意書、同意文書、web 上では同意の確認ボタンなどで同意をいただく情報を指しています。</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社では取得情報項目と利用目的を以下に記載いたします。この取得方法で得られた個人情報に関しましては、本人の権利として、開示等が必要な場合は遅滞なくお知らせすることが可能です。詳細は開示の項目をご覧ください。（例外事項により、開示事項の一部あるいは全部の開示に対応できない場合がございます。）</span></div>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">【商品・サービスのご利用、資料請求及びお問い合わせなどにてお預かりした情報】</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 当社が取扱う商品・サービスの取引並びに第二種金融商品取引業に関する契約の履行、情報、サービスの提供。</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 投資履歴に関する情報の提供。</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(3) 当社が取扱う投資商品に関する商品、サービス等の情報の提供。</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(4) 当社の事業に関する商品・情報・サービス提供のための郵便、電話、電子メール等による営業活動及びマーケティング（アンケートのお願い等）活動。顧客動向分析又は商品開発等の調査分析。</span></div>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p style=\"text-align: left; padding-left: 80px;\"><span style=\"font-weight: 400;\">【お取引先様などの情報】</span></p>\n<div style=\"text-align: left; padding-left: 80px;\"><span style=\"font-weight: 400;\">(1) 当社の商品・サービスの提供に伴う営業活動。</span></div>\n<div style=\"text-align: left; padding-left: 80px;\"><span style=\"font-weight: 400;\">(2) 当社の取引内容を履行するため及び諸事情の連絡。</span></div>\n<div>&nbsp;</div>\n<p style=\"text-align: left; padding-left: 80px;\"><span style=\"font-weight: 400;\">【応募者及び従業者の情報(特定個人情報を含む)】</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">(1) 採用業務及び人事・労務・社会保険、税務・納税などの事務処理及び管理業務。</span></p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;4. ご本人から直接取得させていただくもの「以外」の個人情報について</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">上記「３項」以外の方法で取得した個人情報で、主に当社の取引顧客様などから依頼を受け業務の一部または全部について履行するために必要に応じてお預かりした個人情報を指します。</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">利用目的は以下の通りです。</span></div>\n<p style=\"text-align: left; padding-left: 80px;\"><span style=\"font-weight: 400;\">【取引先様から、委託を受けた業務とそれに付随するそれらのデータなど】</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">(1) お取引様が当社へ委託された当該業務などの遂行。</span></p>\n<p style=\"text-align: left; padding-left: 80px;\"><span style=\"font-weight: 400;\">【官公庁などの公、或いはそれらに準じた機関などから委託を受けたデータなど】</span></p>\n<p style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">(1) データの作成や管理などのため</span></p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;5. 第三者提供について</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">第三者提供につきましては本人の同意がある場合及び、法などの例外がある場合を除きございません。</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">同様に個人情報を加工など行うこと及び、これを第三者に提供することも本人の同意がある場合と法などの例外がある場合を除きございません。</span></div>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;6. 個人情報の保存期限、廃棄など</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">お預かりしました個人情報は、法定保管年数の保有を行います。その後の廃棄は厳重に処分及びデータの廃棄を実施してまいります。</span></div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px; text-align: center;\"><strong><span style=\"font-size: 14pt;\">保有個人データの開示について</span></strong></div>\n<div style=\"padding-left: 40px; text-align: center;\">&nbsp;</div>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;7. 保有個人データの開示等のご請求</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">保有個人データの開示等につきましては個人情報の保護に関する法律（以下「個人情報保護法」といいます。）に規定されるもの及び JISQ15001：2017 に規定されている、保有個人データの開示、利用目的の通知、保有個人データの訂正・追加・削除、保有個人データの利用停止・消去・第三者提供の停止をいいます。</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">ご請求の対象となる個人情報は、原則上記「３項」に記載されている事項などで当社が開示等の権限を有する個人情報に限ります。</span></div>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(1) 開示等のご請求のお申し出先</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">保有個人データの開示等のご請求のお申し出は、当社の個人情報相談窓口に直接お願いします。以下(2)～(5)は、当社個人情報ご相談窓口に開示等ご請求いただく場合の手続きなどを記載しています。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(2) 開示等のご請求の際にご提出いただく書面</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">保有個人データの開示、利用目的の通知、保有個人データの訂正・追加・削除、利用停止・消去・第三者提供の停止など必要事項を「保有個人データ開示等請求書」にご記入のうえ、当社個人情報相談窓口まで、郵送にてお申し込みください。保有個人データ開示等請求書は弊社に直接ご請求ください。</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(3) 保有個人データの開示、利用目的の通知のご請求にかかる手数料</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">保有個人データの開示、利用目的の通知につきまして、１回のご請求ごとに手数料として 1,200 円（消費税込み）を徴収させていただきます。開示請求書または利用目的通知請求書を郵送する際に、1,200 円分の切手または郵便定額小為替を必ず同封してください。</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">「郵便定額小為替」は郵便局で発行しています。小為替発行の際の手数料はお客様のご負担となります。</span></div>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(4) 開示等のご請求ができる方</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">開示等のご請求ができる方は以下の通りとさせていただきます。</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">ご本人様（開示等の対象となる個人情報で特定される方）</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">代理人様（ご本人様より委任された方、または親権者などの法定代理人）</span></div>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">(5) ご本人様、代理人様の確認のための書類</span></p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">開示等のご請求の際に、ご請求された方がご本人様、または代理人様であることを確認するための書類をご提出いただきます。（委任状など）</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">1&nbsp; 開示等をご請求される方がご本人様の場合次のいずれかの添付をお願いいたします。</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">&nbsp; &nbsp; a 運転免許証、パスポート、在留カード いずれか写し１点</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">&nbsp; &nbsp; b 住民票原本（作成日より３ヶ月以内）１点 + 各種健康保険証、国家資格証、学生証または生徒手帳の写しなどいずれか 計２点</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">2&nbsp; 開示等をご請求される方が代理人様の場合</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">上記① a．ｂいずれかの書類とご本人様による委任状</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">（ご本人様による捺印と当該印鑑の印鑑登録証明書をご提出ください。代理人様が親権者などの法定代理人の場合は、ご本人様との関係がわかるものご提出ください。）</span></div>\n<div style=\"padding-left: 80px;\"><span style=\"font-weight: 400;\">又、弁護士などの有資格者の場合はその職業名と登録番号を記載ください。</span></div>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;8. その他</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社は、個人情報保護の取組みのさらなる向上を図るため、または法令その他の規範の変更などに対応するため当社の個人情報保護方針、開示等の手続きなどにつきまして、予告なく変更する場合がございます。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;9. 個人情報保護に関する苦情、相談及びお問合せ先</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社における個人情報保護の取組みに関するご質問やご不明な点、苦情のご相談、その他のお問合せにつきましては 当社、「個人情報ご相談窓口」 までご連絡ください。</span></p>\n<p style=\"padding-left: 40px;\">&nbsp;</p>\n<div><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社 個人情報ご相談窓口</span></div>\n<div><span style=\"font-weight: 400;\">〒106-6137　</span></div>\n<div><span style=\"font-weight: 400;\">東京都港区六本木6-10-1 六本木ヒルズ森タワー37階&nbsp;</span></div>\n<div><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社 個人情報ご相談窓口</span></div>\n<div><span style=\"font-weight: 400;\">TEL : 03-6384-5220&nbsp; FAX：03-6384-5223</span></div>\n<div><span style=\"font-weight: 400;\">E-MAIL：privacy@energyshares.jp</span></div>\n<div>&nbsp;</div>\n<p style=\"text-align: right;\"><span style=\"font-weight: 400;\">制定日 2020年11月16日</span></p>"
