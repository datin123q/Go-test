    policy_type: "POLICY_PROTECTION"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">個人情報保護方針</span></strong></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社(以下、「当社」)は、個人情報の保護、適正な管理が重要な社会責務であることを認識し、以下のとおり個人情報保護方針を定め、これを実行、維持してまいります。</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">&nbsp;1. 基本方針</span></p>\n<p><span style=\"font-weight: 400;\">(1) 当社は、事業目的遂行のため、利用目的を明確化した上で、適切な方法での取得、利用、提供などを行い、取得した個人情報は利用目的の範囲内の利用とし、目的外の利用を行わない様に措置を講じます。</span></p>\n<p><span style=\"font-weight: 400;\">(2) 当社は、取扱う個人情報（特定個人情報を含む）の全てにおき個人情報の取扱いに関する法令、国が定める指針及びその他の規範を遵守いたします。</span></p>\n<p><span style=\"font-weight: 400;\">(3) お預かりした個人情報の一部又は全部を委託する場合は、管理水準の基準を満たした企業及び個人を選定し、契約を行い、適切な措置と管理を講じます。</span></p>\n<p><span style=\"font-weight: 400;\">(4) 当社は、個人情報の漏洩、滅失,き損及び破壊などの危険な状況に対し十分に安全管理及び対策を行い、是正措置を講じます。</span></p>\n<p><span style=\"font-weight: 400;\">(5) 当社は個人情報をお預かりした本人からの個人情報の開示等のご要請にお答えし対応します。</span></p>\n<p><span style=\"font-weight: 400;\">(6) 苦情のご相談に対してはご相談窓口を設け、誠意を持ち迅速に対応をいたします。</span></p>\n<p><span style=\"font-weight: 400;\">(7) 当社は、当社の個人情報マネジメントシステムを継続的に見直すとともに随時改善に取り組んでまいります。</span></p>\n<p><span style=\"font-weight: 400;\">尚、当社の個人情報マネジメントシステムは日本工業規格JISQ１５００１-２０１７に準拠しております。</span></p>\n<div style=\"text-align: right;\"><span style=\"font-weight: 400;\">制定日2020年11月16日</span></div>\n<div style=\"text-align: right;\"><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社</span></div>\n<div style=\"text-align: right;\"><span style=\"font-weight: 400;\">代表取締役 菅原 寿</span><span style=\"font-weight: 400;\">&nbsp;</span></div>\n<p>&nbsp;</p>\n<div><span style=\"font-weight: 400;\">個人情報に関するお問合せ窓口</span></div>\n<div><span style=\"font-weight: 400;\">〒106-6137</span></div>\n<div><span style=\"font-weight: 400;\">東京都港区六本木6-10-1 六本木ヒルズ森タワー37階</span></div>\n<div><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社 個人情報ご相談窓口</span></div>\n<div><span style=\"font-weight: 400;\">TEL : 03-6384-5220&nbsp; FAX：03-6384-5223</span></div>\n<div><span style=\"font-weight: 400;\">E-MAIL：privacy@energyshares.jp</span></div>\n<p>&nbsp;</p>\n<p>&nbsp;</p>\n<p style=\"text-align: center;\"><span style=\"font-size: 14pt;\"><strong>個人情報のお取扱いについて</strong></span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">当社は個人情報保護の取り組みの一環として、個人情報のお取扱いについて、本人の知り得るべき状態における内容とともに、公表すべき事項を以下の通り掲載いたします。</span></p>\n<div><span style=\"font-weight: 400;\">1. 個人情報取り扱い事業者の名称と個人情報保護管理者</span></div>\n<div><span style=\"font-weight: 400;\">&nbsp; &nbsp;エナジーシェアーズ株式会社</span></div>\n<div><span style=\"font-weight: 400;\">&nbsp; &nbsp;個人情報保護管理者 管理部長</span></div>\n<p><span style=\"font-weight: 400;\">2. 共同利用について</span></p>\n<div><span style=\"font-weight: 400;\">当社は、利用目的の達成、より良いサービスを提供するため、当社のグループ会社、業務提携企業及び協力企業との間で、取得した個人情報を共同で利用させていただく場合があります。</span></div>\n<div><span style=\"font-weight: 400;\">共同利用するの個人情報の項目</span></div>\n<div><span style=\"font-weight: 400;\">お名前、性別、生年月日、住所、電話番号、メールアドレス、勤務先、お客様の属性に関する情報、契約内容、お取引履歴等、その他下記「３項」に記載の利用目的を達成するために必要な項目</span></div>\n<p><span style=\"font-weight: 400;\">3. 直接ご本人様から取得させていただく個人情報の利用目的</span></p>\n<div><span style=\"font-weight: 400;\">当社が、直接ご本人様より取得させていただくもので、主に同意書、同意文書、web 上では同意の確認ボタンなどで同意をいただく情報を指しています。</span></div>\n<div><span style=\"font-weight: 400;\">当社では取得情報項目と利用目的を以下に記載いたします。この取得方法で得られた個人情報に関しましては、本人の権利として、開示等が必要な場合は遅滞なくお知らせすることが可能です。詳細は開示の項目をご覧ください。（例外事項により、開示事項の一部あるいは全部の開示に対応できない場合がございます。）</span></div>\n<p><span style=\"font-weight: 400;\">【商品・サービスのご利用、資料請求及びお問い合わせなどにてお預かりした情報】</span></p>\n<div><span style=\"font-weight: 400;\">(1) 当社が取扱う商品・サービスの取引並びに第二種金融商品取引業に関する契約の履行、情報、サービスの提供。</span></div>\n<div><span style=\"font-weight: 400;\">(2) 投資履歴に関する情報の提供。</span></div>\n<div><span style=\"font-weight: 400;\">(3) 当社が取扱う投資商品に関する商品、サービス等の情報の提供。</span></div>\n<div><span style=\"font-weight: 400;\">(4) 当社の事業に関する商品・情報・サービス提供のための郵便、電話、電子メール等による営業活動及びマーケティング（アンケートのお願い等）活動。顧客動向分析又は商品開発等の調査分析。</span></div>\n<p>&nbsp;</p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">【お取引先様などの情報】</span></p>\n<div style=\"text-align: left;\"><span style=\"font-weight: 400;\">(1) 当社の商品・サービスの提供に伴う営業活動。</span></div>\n<div style=\"text-align: left;\"><span style=\"font-weight: 400;\">(2) 当社の取引内容を履行するため及び諸事情の連絡。</span></div>\n<div>&nbsp;</div>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">【応募者及び従業者の情報(特定個人情報を含む)】</span></p>\n<p><span style=\"font-weight: 400;\">(1) 採用業務及び人事・労務・社会保険、税務・納税などの事務処理及び管理業務。</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">&nbsp;4. ご本人から直接取得させていただくもの「以外」の個人情報について</span></p>\n<div><span style=\"font-weight: 400;\">上記「３項」以外の方法で取得した個人情報で、主に当社の取引顧客様などから依頼を受け業務の一部または全部について履行するために必要に応じてお預かりした個人情報を指します。</span></div>\n<div><span style=\"font-weight: 400;\">利用目的は以下の通りです。</span></div>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">【取引先様から、委託を受けた業務とそれに付随するそれらのデータなど】</span></p>\n<p><span style=\"font-weight: 400;\">(1) お取引様が当社へ委託された当該業務などの遂行。</span></p>\n<p style=\"text-align: left;\"><span style=\"font-weight: 400;\">【官公庁などの公、或いはそれらに準じた機関などから委託を受けたデータなど】</span></p>\n<p><span style=\"font-weight: 400;\">(1) データの作成や管理などのため</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">&nbsp;5. 第三者提供について</span></p>\n<div><span style=\"font-weight: 400;\">第三者提供につきましては本人の同意がある場合及び、法などの例外がある場合を除きございません。</span></div>\n<div><span style=\"font-weight: 400;\">同様に個人情報を加工など行うこと及び、これを第三者に提供することも本人の同意がある場合と法などの例外がある場合を除きございません。</span></div>\n<p><span style=\"font-weight: 400;\">&nbsp;6. 個人情報の保存期限、廃棄など</span></p>\n<div><span style=\"font-weight: 400;\">お預かりしました個人情報は、法定保管年数の保有を行います。その後の廃棄は厳重に処分及びデータの廃棄を実施してまいります。</span></div>\n<div>&nbsp;</div>\n<div>&nbsp;</div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px; text-align: center;\"><strong><span style=\"font-size: 14pt;\">保有個人データの開示について</span></strong></div>\n<div style=\"padding-left: 40px; text-align: center;\">&nbsp;</div>\n<p><span style=\"font-weight: 400;\">&nbsp;7. 保有個人データの開示等のご請求</span></p>\n<div><span style=\"font-weight: 400;\">保有個人データの開示等につきましては個人情報の保護に関する法律（以下「個人情報保護法」といいます。）に規定されるもの及び JISQ15001：2017 に規定されている、保有個人データの開示、利用目的の通知、保有個人データの訂正・追加・削除、保有個人データの利用停止・消去・第三者提供の停止をいいます。</span></div>\n<div><span style=\"font-weight: 400;\">ご請求の対象となる個人情報は、原則上記「３項」に記載されている事項などで当社が開示等の権限を有する個人情報に限ります。</span></div>\n<p><span style=\"font-weight: 400;\">(1) 開示等のご請求のお申し出先</span></p>\n<p><span style=\"font-weight: 400;\">保有個人データの開示等のご請求のお申し出は、当社の個人情報相談窓口に直接お願いします。以下(2)～(5)は、当社個人情報ご相談窓口に開示等ご請求いただく場合の手続きなどを記載しています。</span></p>\n<p><span style=\"font-weight: 400;\">(2) 開示等のご請求の際にご提出いただく書面</span></p>\n<p><span style=\"font-weight: 400;\">保有個人データの開示、利用目的の通知、保有個人データの訂正・追加・削除、利用停止・消去・第三者提供の停止など必要事項を「保有個人データ開示等請求書」にご記入のうえ、当社個人情報相談窓口まで、郵送にてお申し込みください。保有個人データ開示等請求書は弊社に直接ご請求ください。</span></p>\n<p><span style=\"font-weight: 400;\">(3) 保有個人データの開示、利用目的の通知のご請求にかかる手数料</span></p>\n<div><span style=\"font-weight: 400;\">保有個人データの開示、利用目的の通知につきまして、１回のご請求ごとに手数料として 1,200 円（消費税込み）を徴収させていただきます。開示請求書または利用目的通知請求書を郵送する際に、1,200 円分の切手または郵便定額小為替を必ず同封してください。</span></div>\n<div><span style=\"font-weight: 400;\">「郵便定額小為替」は郵便局で発行しています。小為替発行の際の手数料はお客様のご負担となります。</span></div>\n<p><span style=\"font-weight: 400;\">(4) 開示等のご請求ができる方</span></p>\n<div><span style=\"font-weight: 400;\">開示等のご請求ができる方は以下の通りとさせていただきます。</span></div>\n<div><span style=\"font-weight: 400;\">ご本人様（開示等の対象となる個人情報で特定される方）</span></div>\n<div><span style=\"font-weight: 400;\">代理人様（ご本人様より委任された方、または親権者などの法定代理人）</span></div>\n<p><span style=\"font-weight: 400;\">(5) ご本人様、代理人様の確認のための書類</span></p>\n<div><span style=\"font-weight: 400;\">開示等のご請求の際に、ご請求された方がご本人様、または代理人様であることを確認するための書類をご提出いただきます。（委任状など）</span></div>\n<div><span style=\"font-weight: 400;\">1&nbsp; 開示等をご請求される方がご本人様の場合次のいずれかの添付をお願いいたします。</span></div>\n<div><span style=\"font-weight: 400;\">&nbsp;a 運転免許証、パスポート、在留カード いずれか写し１点</span></div>\n<div><span style=\"font-weight: 400;\">&nbsp;b 住民票原本（作成日より３ヶ月以内）１点 + 各種健康保険証、国家資格証、学生証または生徒手帳の写しなどいずれか 計２点</span></div>\n<div><span style=\"font-weight: 400;\">2&nbsp; 開示等をご請求される方が代理人様の場合</span></div>\n<div><span style=\"font-weight: 400;\">上記① a．ｂいずれかの書類とご本人様による委任状</span></div>\n<div><span style=\"font-weight: 400;\">（ご本人様による捺印と当該印鑑の印鑑登録証明書をご提出ください。代理人様が親権者などの法定代理人の場合は、ご本人様との関係がわかるものご提出ください。）</span></div>\n<div><span style=\"font-weight: 400;\">又、弁護士などの有資格者の場合はその職業名と登録番号を記載ください。</span></div>\n<p><span style=\"font-weight: 400;\">&nbsp;8. その他</span></p>\n<p><span style=\"font-weight: 400;\">当社は、個人情報保護の取組みのさらなる向上を図るため、または法令その他の規範の変更などに対応するため当社の個人情報保護方針、開示等の手続きなどにつきまして、予告なく変更する場合がございます。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp;9. 個人情報保護に関する苦情、相談及びお問合せ先</span></p>\n<p><span style=\"font-weight: 400;\">当社における個人情報保護の取組みに関するご質問やご不明な点、苦情のご相談、その他のお問合せにつきましては 当社、「個人情報ご相談窓口」 までご連絡ください。</span></p>\n<p>&nbsp;</p>\n<div><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社 個人情報ご相談窓口</span></div>\n<div><span style=\"font-weight: 400;\">〒106-6137　</span></div>\n<div><span style=\"font-weight: 400;\">東京都港区六本木6-10-1 六本木ヒルズ森タワー37階&nbsp;</span></div>\n<div><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社 個人情報ご相談窓口</span></div>\n<div><span style=\"font-weight: 400;\">TEL : 03-6384-5220&nbsp; FAX：03-6384-5223</span></div>\n<div><span style=\"font-weight: 400;\">E-MAIL：privacy@energyshares.jp</span></div>\n<div>&nbsp;</div>\n<p style=\"text-align: right;\"><span style=\"font-weight: 400;\">制定日 2020年11月16日</span></p>"

  - policy_view_type: "POLICY_VIEW_FOOTER"
    policy_type: "POLICY_ANTISOCIAL_FORCES_BAGIC"
    content_html: "<p style=\"text-align: center;\"><span style=\"font-size: 14pt;\"><strong>反社会的勢力に対する基本方針</strong></span></p>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\">エナジーシェアーズ株式会社(以下、「当社」)は、お客様と従業員の安全確保のため、次のとおり反社会的勢力に対して、以下の基本方針を作成し、公表します。</p>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\">1. 当社は、反社会的勢力との取引を一切行いません。</p>\n<p style=\"padding-left: 40px;\">2. 当社は、すでに当社グループと取引をしている方が反社会的勢力であることが判明した場合は、取引を含めた一切の関係を遮断します。</p>\n<p style=\"padding-left: 40px;\">3. 当社は、反社会的勢力への資金提供は絶対に行いません。</p>\n<p style=\"padding-left: 40px;\">4. 反社会的勢力による不当要求に対し、組織全体として対応するとともに、対応する役職員の安全確保に努めます。</p>\n<p style=\"padding-left: 40px;\">5. 当社は、反社会的勢力からの不当要求には一切応じず、反社会的勢力による不当要求が認められた場合には、民事および刑事の両面から積極的な法的対応を行います。</p>\n<p style=\"padding-left: 40px;\">6. 当社は、反社会的勢力の排除に関し、平素より警察、暴力追放運動推進センター、弁護士等関係外部機関と緊密な連携関係を構築します。</p>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px; text-align: right;\">以上</p>"

  - policy_view_type: "POLICY_VIEW_JOIN"
    policy_type: "POLICY_NON_ANTISOCIAL_FORCES_AGREEMENT"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">反社会的勢力でないことの確約に関する同意書</span></strong></p>\n<p>&nbsp;</p>\n<p>エナジーシェアーズ株式会社御中</p>\n<p>&nbsp;</p>\n<p>私(本会員の名義人)は、エナジーシェアーズ株式会社（以下、「貴社」といいます。）に対して、以下の(1)～(4)をそれぞれ表明及び確約いたします。</p>\n<p>&nbsp;</p>\n<p>(1) 現在、かつ、将来にわたっても暴力団員・準構成暴力団員・暴力団関係企業・総会屋等社会運動等標ぼうゴロまたは特殊知能暴力団等の反社会的勢力に該当しません。</p>\n<p>(2) 現在、かつ、将来にわたって、反社会的勢力の企業もしくは反社会的勢力と関連のある企業の役職員ではありません。</p>\n<p>(3) 自らもしくは第三者を利用して、暴力的な要求行為、法的な責任を超えた不当な要求行為、取引に関して脅迫的な言動行為、または、暴力を用いる行為、風説を流布し偽計を用いる行為、並びに、威力をもって貴社の信用を毀損する行為、あるいは、貴社の業務を妨害する行為等を行いません。</p>\n<p>(4) マネーロンダリング（資金洗浄）等の公序良俗に反する取引、その他不法、または不正の疑いある取引に利用するために本取引を行いません。</p>\n<p>&nbsp;</p>\n<p>なお、上記のいずれかに該当、もしくは、上記のいずれかの確約に関して虚偽の申告をしたことが判明した場合には、貴社の提供する一切のサービスの利用申込が受理されず、利用申込が受理された場合であっても取引が停止され、もしくは通知によりこの会員登録が解約されても異議申立てをいたしません。</p>\n<p>また、これにより貴社に損害が生じた場合、すべて私が責任を負うことに同意いたします。</p>\n<p>&nbsp;</p>\n<p style=\"text-align: right;\">制定日 2020年11月16日</p>"

  - policy_view_type: "POLICY_VIEW_JOIN"
    policy_type: "POLICY_SUBSTANTIVE_RULER"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">実質的支配者について</span></strong></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">実質的支配者とは法人の事業活動に支配的な影響力を有すると認められる関係にある方をいい、該当の条件は下記となります。</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">&nbsp;1. 資本多数決法人（株式会社、有限会社、特定目的会社、投資法人）の場合</span></p>\n<div><span style=\"font-weight: 400;\">議決権※が50％を超える個人または法人がいる場合</span></div>\n<div><span style=\"font-weight: 400;\">&rarr;その方が「実質的支配者」となります。</span></div>\n<div><span style=\"font-weight: 400;\">議決権※が50％を超える個人または法人がいない場合</span></div>\n<div><span style=\"font-weight: 400;\">&rarr;25％を超える方すべてが「実質的支配者」となります。</span></div>\n<div><span style=\"font-weight: 400;\">出資、融資、取引その他関係を通じ、</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">事業活動に支配的な影響力を有する個人がいる場合（創業者、会長等）</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">&rarr;その方が「実質的支配者」となります。</span></div>\n<div><span style=\"font-weight: 400;\">それ以外の場合</span></div>\n<div><span style=\"font-weight: 400;\">&rarr;法人を代表し、その業務を執行する方が「実質的支配者」となります。</span></div>\n<div><span style=\"font-weight: 400;\">※議決権の保有は直接または間接によるものも含みます。</span></div>\n<div><span style=\"font-weight: 400;\">間接保有とは実質的支配者が、議決権の50％超を保有する支配法人を通じて保有することをいいます。</span></div>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">&nbsp;2. 資本多数決法人以外（合名会社、合資会社、合同会社、一般社団法人、一般財団法人、学校法人、医療法人、宗教法人、社会福祉法人、特定非営利活動法人）の場合</span></p>\n<div><span style=\"font-weight: 400;\">法人の収益総額の25%を超える配当・分配を受ける権利を有する個人の方がいる場合、または出資、融資、取引その他の関係を通じ、事業活動に支配的な影響力を有すると認められる個人の方がいる場合</span></div>\n<div><span style=\"font-weight: 400;\">&rarr;その方が「実質的支配者」となります。</span></div>\n<div><span style=\"font-weight: 400;\">それ以外の場合</span></div>\n<div><span style=\"font-weight: 400;\">&rarr;法人を代表し、その業務を執行する方が「実質的支配者」となります。</span></div>\n<div>&nbsp;</div>\n<div>&nbsp;</div>\n<div><span style=\"font-weight: 400;\">カスタマーサポート窓口</span></div>\n<div><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社</span></div>\n<div><span style=\"font-weight: 400;\">〒106-6137</span></div>\n<div><span style=\"font-weight: 400;\">東京都港区六本木6-10-1 六本木ヒルズ森タワー37階</span></div>\n<div><span style=\"font-weight: 400;\">「EnegySharesサービス」カスタマーサポート係</span></div>"

  - policy_view_type: "POLICY_VIEW_FOOTER"
    policy_type: "POLICY_SOLICITATION"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">勧誘方針</span></strong></p>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社（以下、「当社」）は、当社の扱う第二種金融商品取引業に係る商品の勧誘にあたって、法令を遵守し以下のとおり方針を策定、公表します。</span></p>\n<p>&nbsp;</p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;1. 勧誘の基本姿勢について</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社は、商品をお勧めする際にお客様の判断と責任においてお取引いただくため、資産状況、取引経験、取引の目的等を考慮した適切な商品提供に努めます。また、リスクや手数料等の商品情報を明瞭に、かつ、お客様の誤解を招くことのないよう説明することに努めます。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;2. 勧誘方法について</span></p>\n<p style=\"text-align: left; padding-left: 40px;\"><span style=\"font-weight: 400;\">当社においては、ウェブサイトやセミナーを通じた勧誘を基本とし、電話や訪問による勧誘は、お客様が迷惑となる時間帯には行わないように努めます。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp; &nbsp; &nbsp;3. その他事項について</span></p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">お客様に対して適切な勧誘が行われるよう、内部での管理体制の強化に努めております。苦情、ご要望がございましたら下記窓口までお問い合わせください。</span></p>\n<p>&nbsp;</p>\n<div><span style=\"font-weight: 400;\">カスタマーサポート窓口</span></div>\n<div><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社</span></div>\n<div><span style=\"font-weight: 400;\">〒106-6137</span></div>\n<div><span style=\"font-weight: 400;\">東京都港区六本木6-10-1 六本木ヒルズ森タワー37階</span></div>\n<div><span style=\"font-weight: 400;\">「EnergySharesサービス」カスタマーサポート係</span></div>\n<div>&nbsp;</div>\n<p style=\"text-align: right;\"><span style=\"font-weight: 400;\">制定日 2020年11月16日</span></p>"

  - policy_view_type: "POLICY_VIEW_FOOTER"
    policy_type: "POLICY_COMMISSION_RISK"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">手数料・リスク等の広告記載事項</span></strong></p>\n<p style=\"text-align: center;\">&nbsp;</p>\n<p style=\"padding-left: 40px;\">エナジーシェアーズ株式会社（以下、「当社」）は、お客様本位の業務運営に関する方針（以下、「本方針」といいます。）を策定するとともに、当社ウェブサイト上で公表します。本方針は、お客様からのご要望や当社の事業展開等を踏まえて、定期的に見直しを行います。</p>\n<p>&nbsp;</p>\n<p>&nbsp; &nbsp; &nbsp;1. 口座開設等の手数料について</p>\n<p style=\"padding-left: 40px;\">当社では、口座開設に際しての手数料等はいただいておりません。ただし、ご利用の金融機関から当社名義の銀行口座宛に送金する際の振込手数料はお客様のご負担となります。振込手数料はご利用の金融機関にご確認ください。</p>\n<p>&nbsp; &nbsp; &nbsp;2. ファンドの持分売却について</p>\n<p style=\"padding-left: 40px;\">当社で取り扱うファンドの配当原資となる債権は、金融商品市場で取引されるものではないため市場価格はありませんが、第三者への売却価格を決定する際は、市場動向の影響を受けることがあります。なお、当社で取り扱うファンドの持分売却は制限されており、当社及びファンド組成企業の承諾が必要となります。</p>\n<p>&nbsp; &nbsp; &nbsp;3. 元本の保証について</p>\n<p style=\"padding-left: 40px;\">当社で取り扱うファンドは、元本が保証されているものではなく、欠損が生じる可能性があります。各ファンドの条件及びリスクの内容や性質の詳細は、重要事項説明書等をよくお読みください。</p>\n<p>&nbsp;</p>\n<p style=\"text-align: right;\">制定日 2020年11月16日</p>"

  - policy_view_type: "POLICY_VIEW_FOOTER"
    policy_type: "POLICY_CUSTOMER_CENTERED_WORK"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">お客様本位の業務運営に関する方針</span></strong></p>\n<p>&nbsp;</p>\n<p style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社(以下、「当社」)は、お客様中心の業務運営を実現するために、お客様中心の業務運営に関する方針を作成し、公表するするとともに、よりよい業務運営を実現するために、定期的にこの方針を見直します。</span></p>\n<p>&nbsp;</p>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">方針１: お客様の最善の利益の追求</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社は、高度の専門性と職業倫理を保持し、お客様に対して誠実・公正に業務を行い、お客様の最善の利益の追求に努めます。また、当社は、こうした業務運営が企業文化として定着するよう努めます。</span></div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">方針2 : 利益相反の適切な管理</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社は、取引におけるお客様との利益相反の可能性について正確に把握し、利益相反の可能性がある場合には、当該利益相反を適切に管理します。当社は、そのための具体的な対応方針をあらかじめ策定します。なお、現在当社が取り扱っているファンド（匿名組合）から、当社の親法人又は子法人（グループ会社）への出資をしておらず、グループ会社への貸付けも行っておりません。</span></div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">方針3: 手数料等の明確化</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社は、その名目を問わず、お客様が負担する手数料その他の費用の詳細を、当該手数料等がどのようなサービスの対価に関するものかを含め、お客様が理解できるよう積極的に情報提供を行い、お客様が、安心してお取引していただけるよう努めます。</span></div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">方針4 : 重要な情報の分かりやすい提供</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社は、上記方針３に示した事項のほか、金融商品・サービスの販売・推奨等に係る重要な情報をお客笠間安心してお取引していただけるよう、お客様が理解できるよう分かりやすい説明及び積極的な情報提供を行うことに努めます。</span></div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">方針 5 : お客様にふさわしいサービスの提供</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">当社は、金融商品取引法第40条の適合性の原則に則り、お客様の資産状況、取引経験、知識及び取引目的・ニーズを把握し、それぞれのお客様にふさわしい金融商品・サービスの組成、販売・推奨等を行うことに努めます。</span></div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">方針６: 従業員に対する適切な動機づけの枠組み等</span></div>\n<div style=\"padding-left: 40px;\"><span style=\"font-weight: 400;\">お客様の最善の利益を追求するための行動、お客様の公正な取扱い、利益相反の適切な管理等を促進するように設計された報酬・業績評価体系、従業員研修その他の適切な動機づけの枠組みや適切なガバナンス体制の整備を行います。</span></div>\n<div style=\"padding-left: 40px;\">&nbsp;</div>\n<p style=\"padding-left: 40px; text-align: right;\"><span style=\"font-weight: 400;\">以上</span></p>"

  - policy_view_type: "POLICY_VIEW_JOIN"
    policy_type: "POLICY_ELECTRONIC_TEACHING"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">電磁的⽅法による書⾯交付（電⼦交付）に関する承諾書</span></strong></p>\n<p>&nbsp;</p>\n<p>エナジーシェアーズ株式会社御中</p>\n<p>私(本会員の名義人)は、電子交付対象である書面等の交付に関し、エナジーシェアーズ株式会社（以下「当社」といいます。）に対して、以下の１～３にそれぞれ承諾したことを表明及び確約いたします。</p>\n<p>&nbsp;</p>\n<p>1. 電⼦交付とは、金融商品取引法に関する法令等に係る各種書⾯（重要事項等の交付（書⾯郵送）に代えて、当サービスの全利⽤者を対象としてインターネットを通じて提供することです。</p>\n<p>2. 当社は、次の(1)～(9)の書⾯（以下「電子交付書面」といいます。）を交付します。電⼦交付に承諾いただけない場合は当サービスをご利⽤いただけませんので、予めご了承ください。</p>\n<div>(1) EnergySharesサービス利用規約</div>\n<div>(2) 個人情報の取り扱いに関する同意書</div>\n<div>(3) 反社会的勢力でないことの確約に関する同意書</div>\n<div>(4) 外国PEPsでないことの同意書</div>\n<div>(5) 成年後見人等に関する同意書</div>\n<div>(6) 電磁的⽅法による書⾯交付（電⼦交付）に関する承諾書</div>\n<div>(7) 取引残高報告書</div>\n<div>(8) 期間損益報告書</div>\n<div>(9) 残高証明書</div>\n<div>(10)その他当社が必要と認めるレポート等の書面</div>\n<p>3. 当社は、次の方法により電子交付を致します。</p>\n<div>(1) 当社が運営しているWEBサイト（以下「当社WEBサイト」といいます。）において書面の記載事項をお客様の閲覧に供し、お客様の使用に係る電子計算機（パソコン、携帯電話等）に備えられたファイル（PDF「Acrobat Reader 8.0以上」）に当該記載事項をダウンロードして記録する方法。</div>\n<div>当社WEBサイトからハイパーリンク等により接続されるファイルに書面の記載事項を記録し、お客様の閲覧に供する方法。</div>\n<div>(2) 当社が電子メールを利用して、お客様の使用に係る電子計算機（パソコン、携帯電話等）に書面の記載事項を送信し、お客様が自己の電子計算機（パソコン、携帯電話等）に備えられたファイルに当該記載事項を記録する方法。</div>\n<p>4. 本サービスを利用する上で電⼦交付に関する次の留意事項をご確認ください。</p>\n<div>(1) 電⼦交付に承諾いただけないと当サービスはご利⽤いただけません。</div>\n<div>(2) 電⼦交付書⾯のうち、上記２の(1)～(6)は本サービス利用登録時に当社サイト上にて閲覧およびダウンロードすることができます。２の(7)以降は、電子交付を致します。</div>\n<div>(3) 別途郵送された書類については、保管をお願いいたします。</div>\n<p>&nbsp;</p>\n<p style=\"text-align: right;\">制定日 2020年11月16日</p>"

  - policy_view_type: "POLICY_VIEW_JOIN"
    policy_type: "POLICY_NON_PEPS"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">外国PEPsに該当しないことの確約に関する同意書</span></strong></p>\n<p>&nbsp;</p>\n<p>エナジーシェアーズ株式会社御中</p>\n<p>私は、貴社のサービス会員登録に際し、下記に記載された｢外国PEPs｣に該当しないことを確約いたします。また、私は、自身が外国PEPsに該当することとなった場合、または該当するおそれが生じた場合には、貴社に対して直ちに当該事項を報告いたします。もし本確約に関して虚偽の申告をしたことが判明した場合、または事後に自身が外国PEPsに該当することになった場合には、私は、貴社が、サービス利用の制限または利用停止/閉鎖を行うことについて、異議なく承諾いたします。</p>\n<p>【外国PEPsについて】</p>\n<p>PEPsとは、Politically Exposed Persons (重要な公的地位を有する者)を指し、外国PEPsとは、以下に該当する職にある方を指します。（犯罪による収益の移転防止に関する法律施行規則15条）</p>\n<p>1&nbsp; 外国の元首</p>\n<p>2&nbsp; 外国において下記の職にある者</p>\n<div style=\"padding-left: 40px;\">a 我が国における内閣総理大臣その他の国務大臣及び副大臣に相当する職</div>\n<div style=\"padding-left: 40px;\">b 我が国における衆議院議長、衆議院副議長、参議院議長又は参議院副議長に相当する職</div>\n<div style=\"padding-left: 40px;\">c 我が国における最高裁判所の裁判官に相当する職</div>\n<div style=\"padding-left: 40px;\">d 我が国における特命全権大使、特命全権公使、特派大使、政府代表又は全権委員に相当する職</div>\n<div style=\"padding-left: 40px;\">e 我が国における統合幕僚長、統合幕僚副長、陸上幕僚長、陸上幕僚副長、海上幕僚長、海上幕僚副長、航空幕僚長又は航空幕僚副長に相当する職</div>\n<div style=\"padding-left: 40px;\">f 中央銀行の役員</div>\n<div style=\"padding-left: 40px;\">g 予算について国会の議決を経、又は承認を受けなければならない法人の役員</div>\n<p>3&nbsp; 過去に①又は②であった者</p>\n<p>4&nbsp; ①～③の家族(配偶者(婚姻の届出をしていないが、事実上婚姻関係と同様の事情にある者を含む。以下この④において同じ)、父母、子及び兄弟姉妹並びにこれらの者以外の配偶者の父母及び子をいう)</p>\n<p>5&nbsp; ①～④が実質的支配者である法人</p>\n<p>&nbsp;</p>\n<p style=\"text-align: right;\">制定日 2020年11月16日</p>"

  - policy_view_type: "POLICY_VIEW_JOIN"
    policy_type: "POLICY_ADULT_GUARDIAN"
    content_html: "<p style=\"text-align: center;\"><strong><span style=\"font-size: 14pt;\">成年後見人等に関する同意書</span></strong></p>\n<p>&nbsp;</p>\n<p>エナジーシェアーズ株式会社御中</p>\n<p>&nbsp;</p>\n<p>私(本会員の名義人)は、エナジーシェアーズ株式会社（以下、「貴社」といいます。）に対して、以下の(1)～(2)をそれぞれ表明及び確約いたします。</p>\n<p>&nbsp;</p>\n<p>(1) 私は、成年被後見人・被保佐人・被補助人ではありません。</p>\n<p>(2) 私は、生活保護を受けている世帯にも属していません。</p>\n<p>&nbsp;</p>\n<p>なお、上記(1)及び(2)のいずれかに該当、または上記のいずれかの確約に関して虚偽の申告をしたことが判明した場合には、貴社の提供する一切のサービスの利用申込が受理されず、利用申込が受理された場合であっても取引が停止され、もしくは通知によりこの会員登録が解約されても異議申立てをいたしません。</p>\n<p>&nbsp;</p>\n<p style=\"text-align: right;\">制定日 2020年11月16日</p>"

  - policy_view_type: "POLICY_VIEW_JOIN"
    policy_type: "POLICY_SPECIFIC_INVESTORS"
    content_html: "<p style=\"text-align: center;\"><strong>特定投資家制度について（告知書）</strong></p>\n<p style=\"text-align: right;\">&nbsp;</p>\n<p style=\"text-align: right;\"><span style=\"font-weight: 400;\">東京都港区六本木６－１０－１</span></p>\n<p style=\"text-align: right;\"><span style=\"font-weight: 400;\">　　　　　　　　　　　　　　　　六本木ヒルズ森タワー３７階</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">エナジーシェアーズ株式会社</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">代表取締役　田中　勝真</span></p>\n<p style=\"text-align: right;\">&nbsp;</p>\n<p><strong>１．特定投資家制度（通称：プロアマ制度）について</strong></p>\n<p><span style=\"font-weight: 400;\">&nbsp;&nbsp;&nbsp;金融商品取引法では、お客さまを「特定投資家（プロ）」と「一般投資家（アマ）」に区分して、金融商品の販売・勧誘を行なうという特定投資家制度（通称：プロアマ制度）が設けられています。</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">&nbsp;&nbsp;お客さまが、「特定投資家（プロ）」に該当する場合には（後記２参照）、当社がお客さまに金融商品を販売・勧誘するにあたり、当社が遵守するべき法律上のルール（行為規制）が一部適用除外となります（後記３参照）。</span></p>\n<p style=\"text-align: right;\">&nbsp;</p>\n<p><strong>２．特定投資家（プロ）に該当するお客さまについて</strong></p>\n<p><span style=\"font-weight: 400;\">法律上、「特定投資家（プロ）」とされるお客さまは以下のとおりです。</span></p>\n<p><span style=\"font-weight: 400;\">【以下の条件を満たす法人等】</span></p>\n<p><span style=\"font-weight: 400;\">①　資本金の額が５億円以上の株式会社</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">②　上場企業（金融商品取引所に上場されている株券の発行者である会社）</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">③　特殊法人、独立行政法人</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">④　特定目的会社、投資者保護基金、預金保険機構、農水産業協同組合貯金保険機構、</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;保険契約者保護機構、金融商品取引業者、特例業務届出者、外国法人</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">⑤　国、日本銀行、適格機関投資家</span></p>\n<p><span style=\"font-weight: 400;\">※　上記、①～⑤の法人に該当しないお客さまは、原則として「一般投資家（アマ）」となります。</span></p>\n<p style=\"text-align: right;\">&nbsp;</p>\n<p><strong>３．特定投資家（プロ）に該当するお客さまに適用されないルールについて</strong></p>\n<p><span style=\"font-weight: 400;\">&nbsp;&nbsp;&nbsp;前記１のとおり、「特定投資家（プロ）」に該当するお客さま（前記２参照）には、金融商品を販売・勧誘される際に当社が遵守するべき法律上のルール（行為規制）のうち以下のものが適用除外となります。</span></p>\n<p><span style=\"font-weight: 400;\">【適用除外ルール】</span></p>\n<p><span style=\"font-weight: 400;\">・ 適合性の原則、広告等の規制、書面による解除（クーリングオフ）</span></p>\n<p><span style=\"font-weight: 400;\">・ 契約締結前及び契約締結時等の書面交付義務</span></p>\n<p><span style=\"font-weight: 400;\">・ 不招請勧誘・再勧誘の禁止・勧誘受諾意思不確認勧誘の禁止</span></p>\n<p><span style=\"font-weight: 400;\">・ 取引態様の事前明示義務、保証金の受領に係る書面交付義務、最良執行方針に係る書面の事前交付義務、顧客の有価証券を担保に供する行為等の制限</span></p>\n<p style=\"text-align: right;\">&nbsp;</p>\n<p><strong>４．特定投資家（プロ）から一般投資家（アマ）への移行について</strong></p>\n<p><span style=\"font-weight: 400;\">&nbsp;&nbsp;&nbsp;「特定投資家（プロ）」に該当されるお客さまのうち、前記２の①～④に該当するお客さまは、金融商品取引法上、契約の種類ごとに金融商品取引契約の締結及びその勧誘に関して、「一般投資家（アマ）」として取り扱うようお申し出いただくことできます。</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">&nbsp;&nbsp;&nbsp;なお、「特定投資家」から「一般投資家」に移行された場合、お客様から「特定投資家」へ復帰のお申し出がない限り「一般投資家」としてお取扱いいたします。「一般投資家」に移行されたお客様が「特定投資家」への復帰を希望される場合には当社までお申し出ください。</span></p>\n<p style=\"text-align: right;\">&nbsp;</p>\n<p><strong>５．当社でのお取扱いについて</strong></p>\n<p><span style=\"font-weight: 400;\">&nbsp;&nbsp;&nbsp;当社では、｢特定投資家（プロ）｣に該当されるお客さまであっても、｢一般投資家（アマ）｣とは特に区分を行わず、前記３に記載した法律上適用が除外されるルールについても、｢一般投資家（アマ）｣と同様の丁寧な対応に努め、前記４に記載いたしましたお申し出をいただかなくても、お客さまに不都合が生じないように心掛けてまいります。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp;&nbsp;&nbsp;それでも「一般投資家（アマ）」としての法律上のお取扱いをご希望されるお客さまは、金融商品取引契約を締結される前又は勧誘を受ける前に、当社までお申し出ください。</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">&nbsp;&nbsp;&nbsp;なお、お申し出をいただいた場合は、当社より、承諾日等を記載した承諾書面を、金融商品取引契約を締結される前に交付することが義務付けられておりますことから、当該書面交付までの間、お取引が制限されることとなりますので、ご注意ください。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp;&nbsp;&nbsp;また、法律上は、一定の要件に該当する｢一般投資家（アマ）｣が「特定投資家（プロ）」に移行することも可能となっておりますが、投資者保護に欠けることとなるおそれもあることから、当社においては｢一般投資家（アマ）｣としてのお取扱をさせていただきますので、ご理解下さいますようお願い申し上げます。</span></p>\n<p><span style=\"font-weight: 400;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;特定投資家制度（プロアマ制度）についてご不明な点がございましたら、以下の窓口までお尋ね下さ</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">い。</span></p>\n<p style=\"text-align: right;\"><span style=\"font-weight: 400;\">【投資家用窓口】</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">&nbsp;　　　投資家用電話番号：03-6384-5220</span><span style=\"font-weight: 400;\"><br /></span><span style=\"font-weight: 400;\">&nbsp;　　　Ｅ-ＭＡＩＬ：info@energyshares.jp<br /></span>制定日 2020年11月16日</p>"

