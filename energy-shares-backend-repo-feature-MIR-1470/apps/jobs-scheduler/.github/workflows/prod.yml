name: Production v1 Deploy To Amazon EC2 with CodeDeploy and S3

on:
  push:
    branches:
      - prod

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

      - name: Set up Go 1.x
        uses: actions/setup-go@v3
        with:
          go-version: ^1.22
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v3
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_RELEASE_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_RELEASE_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1
      - name: Configure git for private modules
        env:
          TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: git config --global url."https://hillfolk:${TOKEN}@github.com/illuminarean".insteadOf "https://github.com/illuminarean"
      #        run: git config --global url.ssh://git@github.com/.insteadOf https://github.com/

      - name: Get dependencies
        env:
          GOPRIVATE: "github.com/illuminarean"
          GOPROXY: "https://proxy.golang.org,direct"
        #          GOSUMDB: "github.com/illuminarean"
        run: |
          go get -v -t -d ./...
          if [ -f Gopkg.toml ]; then
              curl https://raw.githubusercontent.com/golang/dep/master/install.sh | sh
              dep ensure
          fi

      - name: Build
        env:
          GOPRIVATE: "github.com/illuminarean"
          GOPROXY: "https://proxy.golang.org,direct"
          GOSUMDB: "github.com/illuminarean"
        run: |
          GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -o .
      - name: Copy files
        run: |
          mkdir bin
          cp -R ./energyshares-job-scheduler ./config.prod.yml ./config.yml ./i18n ./font ./deployscripts ./bin
          cp ./conf.prod.json ./bin/conf.json
        shell: bash

      - name: Make zip file
        run: zip -qq -r ./$GITHUB_SHA.zip ./bin ./appspec.yml
        shell: bash

      - name: Upload to S3
        env:
          PROJECT_NAME: job-scheduler
          BUCKET_TYPE: prod-v1
          BUCKET_NAME: eskk-prod-deploy-bucket
        run: ls | aws s3 cp --region ap-northeast-1 ./$GITHUB_SHA.zip s3://$BUCKET_NAME/$BUCKET_TYPE/$PROJECT_NAME/$GITHUB_SHA.zip

      - name: Code Deploy
        env:
          PROJECT_NAME: job-scheduler
          BUCKET_TYPE: prod-v1
          BUCKET_NAME: eskk-prod-deploy-bucket
        run: aws deploy create-deployment --application-name eskk-prod-job-scheduler  --deployment-config-name CodeDeployDefault.OneAtATime --deployment-group-name eskk-prod-job-scheduler-group  --s3-location bucket=$BUCKET_NAME,bundleType=zip,key=$BUCKET_TYPE/$PROJECT_NAME/$GITHUB_SHA.zip
