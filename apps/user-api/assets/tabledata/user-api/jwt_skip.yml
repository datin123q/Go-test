#############
# [작성 방법]
#
# 모든 method 에 대하여 jwt skip 을 적용하고 싶은 경우: method 를 "" 로 설정
# - path: "/api/examples"
#   method: ""
#
# (권장)
# 특정 method 에 대하여 jwt skip 을 적용하고 싶은 경우: method 를 콤마(,) 로 구분하여 설정
# - path: "/api/examples"
#   method: "GET,POST"
#
#############

jwt_skip_data:
  # swagger
  - path: "/doc"
    method: ""
  - path: "/doc/swagger.json"
    method: ""
  - path: "/api/swagger"
    method: ""
  - path: "/api/swagger*"
    method: ""

  # common
  - path: "/api/version"
    method: "GET"
  - path: "/api/codes"
    method: "GET"
  - path: "/api/health-check"
    method: "GET"

  # auth
  - path: "/api/auth/update-token"
    method: ""

  # blog-posts
  - path: "/api/blog-posts"
    method: "GET"

  # columns
  - path: "/api/columns/:id"
    method: "GET"
  - path: "/api/columns/:id/preview/:user_id"
    method: "GET"
  - path: "/api/columns"
    method: "GET"

  # contact
  - path: "/api/contact/send-contact-mail"
